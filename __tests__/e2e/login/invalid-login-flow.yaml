# Test Case 2: Invalid login Flow
appId: host.exp.exponent
---
- openLink: exp://192.168.1.149:8081

# Navigate to login
- tapOn:
    text: "SE CONNECTER"
    optional: true

# Fill in invalid credentials
- tapOn:
    text: "E-mail"
- inputText: "invalid@example.com"
- hideKeyboard

- tapOn:
    text: "Mot de passe"
- inputText: "wrongpassword"
- hideKeyboard

# Submit form
- tapOn:
    id: "login-submit-button"

# Wait and verify error message appears
- assertVisible:
    text: "Mot de passe ou email incorrect"

# Verify we're still on login screen
- assertVisible: "SE CONNECTER"

